packages:
  - apps/*
  - packages/*

# Every third-party dependency is pinned here, once. Packages refer to it with
# "catalog:". Renovate keeps these versions up to date.
catalog:
  # tooling
  lefthook: 2.2.2
  oxfmt: 0.80.0
  oxlint: 1.95.0
  turbo: 2.11.13
  typescript: 7.0.2
  '@types/node': 26.6.6
  '@rstest/core': 0.12.6
  happy-dom: 21.0.4
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  # contracts
  valibot: 1.5.0
  '@valibot/to-json-schema': 1.8.0
  # web
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.3
  '@types/react-dom': 19.3.0
  '@rsbuild/core': 2.3.3
  '@rsbuild/plugin-react': 2.1.1
  '@tanstack/react-router': 1.170.46
  '@tanstack/router-plugin': 1.169.0
  '@tanstack/react-query': 5.108.4
  ky: 2.2.0
  # component library: filled in by agent-kit from templates/ui/<library>/ui.json
  tailwindcss: 4.3.5
  '@tailwindcss/postcss': 4.3.5
  # api (node-postgres)
  fastify: 5.12.8
  pino: 10.4.0
  '@scalar/fastify-api-reference': 1.83.0
  kysely: 0.29.9
  pg: 8.23.1
  '@types/pg': 8.23.1
  # api (hono-cloudflare)
  hono: 4.13.21
  '@scalar/hono-api-reference': 0.12.24
  wrangler: 4.168.0
  '@cloudflare/workers-types': 5.20261124.1
  kysely-d1: 0.4.0
  # e2e
  e2e: 0.25.0
  '@e2e-dev/web': 0.17.0
  '@e2e-dev/acp': 0.1.4
  '@agentclientprotocol/claude-agent-acp': 0.110.1

# Packages allowed to run install scripts. Everything else is blocked.
allowBuilds:
  lefthook: false
  esbuild: true
  workerd: true
  sharp: false
