# Local Postgres for development and e2e. Start with: docker compose up -d --wait
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitapp
      POSTGRES_PASSWORD: kitapp
      POSTGRES_DB: kitapp
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kitapp -d kitapp']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
